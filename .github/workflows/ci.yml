name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # The compiler these sources are built and tested with (keep equal to .cancho-rev). Raising it is a deliberate act.
  CANCHO_REV: f4ead824f33b291a0ad7620a34a0c1346a7abe4f

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: diff

      - name: The pin files agree
        working-directory: diff
        run: test "$(cat .cancho-rev)" = "$CANCHO_REV"

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ env.CANCHO_REV }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ env.CANCHO_REV }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      # Nothing is built yet: with no sources the gate has nothing to judge and says so. It starts judging the day src/ has a file.
      - name: Format, check, test
        working-directory: diff
        run: |
          C=../cancho/target/release/cancho
          if ls src/*.cho >/dev/null 2>&1; then
            $C fmt --check src tests
            $C check src/*.cho --std
            for t in tests/*_test.cho; do [ -e "$t" ] && $C test "$t" src/*.cho --std; done
            find src tests -name '*.cho' | xargs -r wc -l | awk '$2 != "total" && $1 > 2000 { print $2 " is over 2000 lines"; bad = 1 } END { exit bad }'
          else
            echo "no sources yet: nothing to check"
          fi
